<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L❤️H TOOLKIT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ═══════════════════════════════
   CSS VARIABLES — DARK (default)
═══════════════════════════════ */
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --nm-bg: #1e2240;
  --nm-light: #252c52;
  --nm-dark: #12172c;
  --nm-inset-light: #1c2240;
  --nm-inset-dark: #10152a;
  --card: #1e2240;
  --accent: #ff3366;
  --accent2: #ff6b35;
  --gold: #ffd700;
  --text: #e0e0f0;
  --text2: #a0a0c0;
  --muted: #6060a0;
  --green: #00ff88;
  --blue: #4fc3f7;
  --shadow-light: rgba(37,44,82,0.8);
  --shadow-dark: rgba(18,23,44,0.9);
  --glow: rgba(255,51,102,0.4);
  --transition: 0.4s cubic-bezier(.23,1,.32,1);
}
[data-theme="light"] {
  --bg: #e8ecf0;
  --surface: #dde3ea;
  --nm-bg: #e0e6ed;
  --nm-light: #f5f8fc;
  --nm-dark: #c8cfd8;
  --nm-inset-light: #e8ecf2;
  --nm-inset-dark: #d0d6de;
  --card: #e4e9f0;
  --text: #1a1a2e;
  --text2: #4a4a6e;
  --muted: #8888aa;
  --shadow-light: rgba(255,255,255,0.9);
  --shadow-dark: rgba(190,200,215,0.9);
  --glow: rgba(255,51,102,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── NEUMORPHISM MIXINS ── */
.nm {
  background:var(--nm-bg);
  box-shadow:
    6px 6px 14px var(--nm-dark),
    -6px -6px 14px var(--nm-light);
  border-radius:16px;
}
.nm-sm {
  background:var(--nm-bg);
  box-shadow:
    4px 4px 10px var(--nm-dark),
    -4px -4px 10px var(--nm-light);
  border-radius:12px;
}
.nm-inset {
  background:var(--nm-bg);
  box-shadow:
    inset 4px 4px 10px var(--nm-inset-dark),
    inset -4px -4px 10px var(--nm-inset-light);
  border-radius:12px;
}
.nm-btn {
  background:var(--nm-bg);
  box-shadow:
    5px 5px 12px var(--nm-dark),
    -5px -5px 12px var(--nm-light);
  border-radius:12px;
  border:none;
  cursor:pointer;
  transition:all 0.15s ease;
}
.nm-btn:active {
  box-shadow:
    inset 3px 3px 8px var(--nm-dark),
    inset -3px -3px 8px var(--nm-light);
  transform:scale(0.97);
}

/* ══════════════════════════════
   SCREEN ROUTER
══════════════════════════════ */
.screen { display:none; min-height:100vh; }
.screen.active { display:flex; }

/* ══════════════════════════════
   LOGIN SCREEN
══════════════════════════════ */
#loginScreen {
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  flex-direction:column;
}

/* Animated BG */
.bg-orbs {
  position:fixed; inset:0; pointer-events:none; z-index:0;
}
.orb {
  position:absolute; border-radius:50%;
  filter:blur(60px); opacity:0.15; animation:orbFloat 8s ease-in-out infinite;
}
.orb1 { width:400px;height:400px;background:var(--accent);top:-100px;left:-100px;animation-delay:0s; }
.orb2 { width:300px;height:300px;background:#7b2fff;top:50%;right:-80px;animation-delay:2s; }
.orb3 { width:250px;height:250px;background:var(--blue);bottom:-50px;left:30%;animation-delay:4s; }
.orb4 { width:200px;height:200px;background:var(--gold);bottom:20%;left:-50px;animation-delay:1s; }

@keyframes orbFloat {
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-30px) scale(1.05);}
}

/* Light streaks */
.streak {
  position:absolute; width:2px; opacity:0;
  background:linear-gradient(to bottom,transparent,var(--accent),transparent);
  animation:streakFall 4s linear infinite;
}
.streak:nth-child(1){left:15%;height:120px;animation-delay:0s;}
.streak:nth-child(2){left:35%;height:80px;animation-delay:1.2s;}
.streak:nth-child(3){left:60%;height:140px;animation-delay:0.7s;}
.streak:nth-child(4){left:80%;height:100px;animation-delay:2s;}
.streak:nth-child(5){left:5%;height:90px;animation-delay:3s;}
.streak:nth-child(6){right:10%;height:110px;animation-delay:1.8s;}
@keyframes streakFall {
  0%{opacity:0;top:-10%;}
  20%{opacity:1;}
  80%{opacity:1;}
  100%{opacity:0;top:110%;}
}

/* Login card */
.login-card {
  position:relative; z-index:10;
  width:420px; padding:44px 36px;
  background:var(--nm-bg);
  box-shadow:
    12px 12px 30px var(--nm-dark),
    -12px -12px 30px var(--nm-light),
    0 0 60px rgba(255,51,102,.1);
  border-radius:24px;
  text-align:center;
  animation:cardIn .7s var(--transition);
}
@keyframes cardIn {
  from{opacity:0;transform:translateY(40px) scale(.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* Logo */
.login-logo {
  margin-bottom:10px;
  display:inline-block;
}
.login-logo img, #logoIconEl {
  width:90px; height:90px;
  border-radius:22px;
  object-fit:cover;
  box-shadow:
    0 0 0 3px rgba(255,51,102,0.3),
    0 0 30px var(--glow),
    0 8px 32px rgba(0,0,0,0.4);
  animation: heartbeat 2.8s ease-in-out infinite;
  display:block;
}
@keyframes heartbeat {
  0%,100% { transform: scale(1);    box-shadow: 0 0 0 3px rgba(255,51,102,0.25), 0 0 22px var(--glow); }
  50%      { transform: scale(1.05); box-shadow: 0 0 0 5px rgba(255,51,102,0.4),  0 0 32px var(--glow); }
}
.login-logo-icon {
  width:90px;height:90px;border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:2rem; box-shadow:0 0 30px var(--glow);
  color:#fff;font-weight:900;font-family:'Orbitron',sans-serif;
  animation: heartbeat 2.8s ease-in-out infinite;
}

.login-title {
  font-family:'Orbitron',sans-serif;
  font-size:1.5rem; font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:10px 0 4px;
  letter-spacing:2px;
}
.login-sub { color:var(--text2); font-size:.9rem; margin-bottom:28px; }

/* Input field */
.nm-input-wrap { position:relative; margin-bottom:18px; }
.nm-input-wrap i {
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--muted); font-size:.9rem;
}
.nm-input {
  width:100%; padding:13px 16px 13px 42px;
  background:var(--nm-bg);
  box-shadow:inset 4px 4px 10px var(--nm-dark),inset -4px -4px 10px var(--nm-light);
  border:none; border-radius:12px;
  color:var(--text); font-size:1rem; font-family:'Rajdhani',sans-serif;
  outline:none; transition:box-shadow .3s;
}
.nm-input::placeholder { color:var(--muted); }
.nm-input:focus {
  box-shadow:inset 4px 4px 10px var(--nm-dark),inset -4px -4px 10px var(--nm-light),0 0 0 2px var(--accent);
}

/* Login button */
.login-btn {
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:5px 5px 15px var(--nm-dark),-5px -5px 15px var(--nm-light),0 4px 20px var(--glow);
  border:none; border-radius:12px;
  color:#fff; font-family:'Orbitron',sans-serif;
  font-size:.85rem; font-weight:600; cursor:pointer;
  letter-spacing:2px; transition:all .2s;
}
.login-btn:hover { box-shadow:5px 5px 15px var(--nm-dark),-5px -5px 15px var(--nm-light),0 8px 30px var(--glow); transform:translateY(-2px); }
.login-btn:active { transform:scale(.97); }

.login-err { color:var(--accent); font-size:.85rem; margin-top:10px; display:none; padding:8px; border-radius:8px; background:rgba(255,51,102,.1); }
.buy-link {
  margin-top:18px; color:var(--text2); font-size:.88rem;
}
.buy-link a { color:var(--gold); text-decoration:none; font-weight:600; }
.buy-link a:hover { text-decoration:underline; }

/* Theme toggle on login */
.login-theme-btn {
  position:absolute; top:16px; right:16px;
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text2); font-size:1rem; z-index:11;
}

/* ══════════════════════════════
   WELCOME SCREEN
══════════════════════════════ */
#welcomeScreen {
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  position:fixed; inset:0; z-index:500;
}
.welcome-content { text-align:center; animation:welcomeIn .8s var(--transition); }
@keyframes welcomeIn {
  from{opacity:0;transform:scale(.8);}
  to{opacity:1;transform:scale(1);}
}
.welcome-logo { font-size:5rem; animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse {0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.welcome-title {
  font-family:'Orbitron',sans-serif; font-size:2.2rem; font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--gold),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:12px 0 8px; letter-spacing:3px;
}
.welcome-msg { color:var(--text2); font-size:1.1rem; }
.welcome-user { color:var(--gold); font-weight:700; }
.welcome-bar {
  width:200px; height:4px; background:var(--nm-inset-dark);
  border-radius:2px; margin:20px auto 0; overflow:hidden;
}
.welcome-bar-fill {
  height:100%; width:0;
  background:linear-gradient(90deg,var(--accent),var(--gold));
  border-radius:2px;
  animation:barFill 2.2s ease-in-out forwards;
}
@keyframes barFill{to{width:100%;}}

/* ══════════════════════════════
   MAIN TOOLKIT
══════════════════════════════ */
#toolkitScreen {
  flex-direction:column;
  min-height:100vh;
}

/* TOPBAR */
.tk-topbar {
  height:64px;
  background:var(--nm-bg);
  box-shadow:0 4px 16px var(--nm-dark);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; position:sticky; top:0; z-index:100;
  flex-shrink:0;
}
.tk-brand {
  font-family:'Orbitron',sans-serif; font-size:1.1rem; font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  display:flex; align-items:center; gap:10px;
}
.tk-brand-logo { width:36px;height:36px;border-radius:50%;object-fit:cover; }
.tk-brand-icon {
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:.85rem;font-weight:900;
}
.tk-right { display:flex;align-items:center;gap:12px; }
.tk-user { color:var(--text2);font-size:.9rem; }
.tk-user span { color:var(--gold);font-weight:700; }
.tk-icon-btn {
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text2); font-size:1rem;
  transition:color .2s;
}
.tk-icon-btn:hover { color:var(--accent); }
.key-badge {
  background:rgba(255,215,0,.12); color:var(--gold);
  border:1px solid rgba(255,215,0,.3);
  padding:4px 12px; border-radius:20px;
  font-size:.75rem; font-family:'Orbitron',sans-serif;
}

/* MAIN CONTENT */
.tk-content { flex:1; padding:28px 24px; max-width:1200px; margin:0 auto; width:100%; }

.tk-section-title {
  font-family:'Orbitron',sans-serif; font-size:1rem; color:var(--text2);
  letter-spacing:2px; text-transform:uppercase; margin-bottom:18px;
  display:flex; align-items:center; gap:10px;
}
.tk-section-title::after {
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg,var(--nm-dark),transparent);
}

/* TOOLS GRID — 3 per row */
.tools-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:32px;
}

/* TOOL CARD */
.tool-card {
  background:var(--nm-bg);
  box-shadow:8px 8px 20px var(--nm-dark),-8px -8px 20px var(--nm-light);
  border-radius:20px;
  padding:22px 18px;
  cursor:pointer;
  transition:all var(--transition);
  text-decoration:none;
  color:inherit;
  display:flex; flex-direction:column; align-items:center;
  text-align:center; gap:10px;
  position:relative; overflow:hidden;
  animation:cardEnter .5s var(--transition) both;
}
.tool-card::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  opacity:0; transition:opacity .3s; border-radius:inherit;
}
.tool-card:hover {
  box-shadow:10px 10px 25px var(--nm-dark),-10px -10px 25px var(--nm-light),0 0 30px var(--glow);
  transform:translateY(-4px);
}
.tool-card:hover::before { opacity:.06; }

@keyframes cardEnter {
  from{opacity:0;transform:translateY(20px) scale(.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* Staggered delays */
.tool-card:nth-child(1){animation-delay:.05s}
.tool-card:nth-child(2){animation-delay:.1s}
.tool-card:nth-child(3){animation-delay:.15s}
.tool-card:nth-child(4){animation-delay:.2s}
.tool-card:nth-child(5){animation-delay:.25s}
.tool-card:nth-child(6){animation-delay:.3s}
.tool-card:nth-child(7){animation-delay:.35s}
.tool-card:nth-child(8){animation-delay:.4s}
.tool-card:nth-child(9){animation-delay:.45s}

.tool-icon-wrap {
  width:56px; height:56px; border-radius:16px;
  background:var(--nm-bg);
  box-shadow:inset 4px 4px 10px var(--nm-dark),inset -4px -4px 10px var(--nm-light);
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; color:var(--accent); position:relative; z-index:1;
  transition:transform .3s;
}
.tool-card:hover .tool-icon-wrap { transform:scale(1.1) rotate(-4deg); }
.tool-icon-wrap img { width:32px;height:32px;border-radius:8px;object-fit:cover; }
.tool-name { font-weight:700; font-size:.95rem; color:var(--text); position:relative; z-index:1; }
.tool-desc { font-size:.78rem; color:var(--text2); position:relative; z-index:1; line-height:1.4; }
.tool-arrow {
  position:relative; z-index:1;
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.7rem;
  box-shadow:0 4px 12px var(--glow);
  transform:translateX(0); transition:transform .3s;
}
.tool-card:hover .tool-arrow { transform:translateX(4px); }

/* Empty state */
.empty-tools {
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted);
}
.empty-tools i { font-size:3rem; margin-bottom:14px; display:block; opacity:.5; }
.empty-tools p { font-size:1rem; }

/* KEY INFO */
.key-info-card {
  padding:18px 22px;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:28px;
}
.key-info-left { display:flex;align-items:center;gap:14px; }
.key-info-icon {
  width:48px;height:48px;border-radius:14px;
  background:var(--nm-bg);
  box-shadow:inset 4px 4px 10px var(--nm-dark),inset -4px -4px 10px var(--nm-light);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:1.2rem;
}
.key-info-text .key-val-display {
  font-family:'Orbitron',sans-serif; font-size:.85rem; color:var(--gold);
}
.key-info-text .key-time-left { font-size:.8rem; color:var(--text2); margin-top:2px; }
.key-time-left span { color:var(--green); font-weight:700; }

/* FOOTER */
.tk-footer { text-align:center; padding:20px; color:var(--muted); font-size:.8rem; }

/* LOADING */
.tools-loading { grid-column:1/-1; text-align:center; padding:40px; color:var(--muted); }
.loading-spinner {
  width:40px;height:40px;border-radius:50%;
  border:3px solid var(--nm-dark); border-top-color:var(--accent);
  animation:spin .8s linear infinite; margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* TOAST */
.tk-toast {
  position:fixed;bottom:24px;right:24px;
  background:var(--nm-bg);
  box-shadow:6px 6px 16px var(--nm-dark),-6px -6px 16px var(--nm-light);
  color:var(--green); padding:12px 20px; border-radius:12px;
  font-size:.9rem; transform:translateY(100px); opacity:0;
  transition:all .4s var(--transition); z-index:9999;
  border-left:3px solid var(--green);
}
.tk-toast.show { transform:translateY(0);opacity:1; }
.tk-toast.err { color:var(--accent); border-left-color:var(--accent); }

/* RESPONSIVE */
@media(max-width:768px){
  .tools-grid{grid-template-columns:repeat(2,1fr);}
  .login-card{width:90%;padding:32px 24px;}
}
@media(max-width:480px){
  .tools-grid{grid-template-columns:1fr;}
  .welcome-title{font-size:1.5rem;}
}

/* WHATSAPP BUY BUTTON */
.wa-buy-btn {
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:14px;
  padding:13px 20px;
  background:linear-gradient(135deg,#25d366,#128c7e);
  border-radius:14px;
  color:#fff !important;
  font-family:'Orbitron',sans-serif;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:1px;
  text-decoration:none !important;
  box-shadow:
    4px 4px 12px var(--nm-dark),
    -4px -4px 12px var(--nm-light),
    0 4px 20px rgba(37,211,102,0.35);
  transition:all .2s;
  -webkit-text-fill-color:#fff !important;
  position:relative;
  overflow:hidden;
}
.wa-buy-btn::before {
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
  border-radius:inherit;
}
.wa-buy-btn i {
  font-size:1.3rem;
  animation:waPulse 1.5s ease-in-out infinite;
}
.wa-buy-btn:hover {
  transform:translateY(-3px);
  box-shadow:4px 4px 12px var(--nm-dark),-4px -4px 12px var(--nm-light),0 8px 28px rgba(37,211,102,0.5);
}
.wa-buy-btn:active { transform:scale(.96); }
@keyframes waPulse {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.2);}
}

/* TYPEWRITER */
.type-cursor, .type-cursor2 {
  display:inline-block;
  color:var(--accent);
  font-weight:300;
  animation:blink .7s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* ── ANIMATED LIGHT BORDER ── */
.nm-input-wrap {
  position: relative;
}
.nm-input-wrap::before {
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:14px;
  padding:2px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    var(--accent) 25%,
    var(--gold) 50%,
    var(--accent2) 75%,
    transparent 100%
  );
  background-size: 300% 300%;
  animation: borderRun 6s linear infinite;
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
  z-index:0;
}

.login-btn {
  position:relative;
  overflow:visible !important;
  z-index:1;
}
.login-btn::before {
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:14px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    #fff 20%,
    var(--accent) 40%,
    var(--gold) 60%,
    var(--accent2) 80%,
    transparent 100%
  );
  background-size: 300% 300%;
  animation: borderRun 5s linear infinite;
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
  z-index:-1;
  padding:2px;
}

.wa-buy-btn {
  position:relative;
  overflow:visible !important;
}
.wa-buy-btn::after {
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:16px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    #fff 20%,
    #25d366 40%,
    #a8ff78 60%,
